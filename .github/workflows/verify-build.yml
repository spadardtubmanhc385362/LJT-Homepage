name: Verify Jekyll build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage" --trace
        env:
          JEKYLL_ENV: production
      - name: Generated HTML files
        run: find _site -name '*.html' | sort
      - name: Home page checks
        run: |
          echo "--- publication titles on home page (count) ---"
          for t in "SynLogic" "Perception Bottleneck" "Universal Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient"; do
            printf '%s => ' "$t"; grep -o "$t" _site/index.html | wc -l
          done
          echo "--- section headings on home page ---"
          grep -o '<h1 id="[^"]*"' _site/index.html
          echo "--- contact / author details on home page ---"
          for t in "jliugi@connect.ust.hk" "Vicent0205" "junteng88716710" "tbK9jl4AAAAJ" "Zhiyuan Honor Scholarship" "MINIMAX" "Tencent WXG" "Shanghai AI Lab" "Junxian He" "Zifei Shan" "Yu Cheng"; do
            printf '%s => ' "$t"; grep -o "$t" _site/index.html | wc -l
          done
          echo "--- publication links on home page ---"
          grep -o 'href="[^"]*publication/[^"]*"' _site/index.html | sort -u
          echo "--- sidebar author block ---"
          grep -o 'author__name">[^<]*<' _site/index.html
          grep -o 'author__bio">[^<]*<' _site/index.html
      - name: Publications page checks
        run: |
          echo "--- category headings ---"
          grep -o '<h2>[^<]*</h2>' _site/publications/index.html
          echo "--- number of publication entries ---"
          grep -o 'archive__item-title' _site/publications/index.html | wc -l
          echo "--- entry titles ---"
          grep -o 'archive__item-title"[^>]*>.*</h2>' _site/publications/index.html | sed 's/<[^>]*>//g'
          echo "--- venue lines ---"
          grep -o 'Published in <i>[^<]*</i>, [0-9]*' _site/publications/index.html
      - name: Individual publication pages
        run: |
          find _site/publication -name 'index.html' | sort
          echo "--- sample page ---"
          cat _site/publication/2024-universal-truthfulness-hyperplane/index.html | sed 's/></>\n</g' | grep -v '^[[:space:]]*$' | head -60
      - name: Leftover template placeholders
        run: |
          for t in "Paper Title Number" "Your Name" "GitHub University" "Red Brick University" "john+snow" "PS_CX0AAAAAJ" "blog-post" "talk-1"; do
            printf '%s => ' "$t"; c=$(grep -ril "$t" _site | wc -l); echo "$c file(s)"; grep -ril "$t" _site || true
          done
